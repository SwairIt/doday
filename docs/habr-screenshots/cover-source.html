<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'X'; src: local('Segoe UI'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:780px; height:440px; overflow:hidden;
         font-family:'Segoe UI',system-ui,sans-serif;
         background:#0d0820; color:#f5f3ff; position:relative; }
  .glow1 { position:absolute; width:520px; height:520px; left:-120px; top:-180px;
           background:radial-gradient(circle,#7b2ff7aa 0%,transparent 65%); }
  .glow2 { position:absolute; width:460px; height:460px; right:-140px; bottom:-200px;
           background:radial-gradient(circle,#00e5ff66 0%,transparent 65%); }
  .grid { position:absolute; inset:0;
          background-image:linear-gradient(#ffffff08 1px,transparent 1px),
                           linear-gradient(90deg,#ffffff08 1px,transparent 1px);
          background-size:40px 40px; }
  .wrap { position:relative; padding:40px 44px; height:100%; display:flex; flex-direction:column; }
  .top { display:flex; align-items:center; gap:10px; }
  .logo { width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
          background:linear-gradient(135deg,#7b2ff7,#a855f7); font-weight:800; font-size:19px; }
  .brand { font-weight:700; font-size:19px; letter-spacing:-.01em; }
  .dom { margin-left:auto; font-family:Consolas,monospace; font-size:13px; color:#a99fd0; }
  h1 { margin-top:30px; font-size:40px; line-height:1.08; font-weight:800; letter-spacing:-.02em; max-width:600px; }
  h1 .accent { background:linear-gradient(90deg,#c084fc,#22d3ee);
               -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { margin-top:14px; font-size:15.5px; color:#b9b1da; max-width:390px; line-height:1.5; }
  .stats { margin-top:auto; display:flex; gap:14px; }
  .card { flex:1; background:#ffffff0d; border:1px solid #ffffff1a; border-radius:14px;
          padding:14px 16px; }
  .num { font-size:30px; font-weight:800; letter-spacing:-.02em; }
  .lbl { margin-top:2px; font-size:12.5px; color:#a99fd0; }
  .c1 .num { color:#ff7d9e; } .c2 .num { color:#c084fc; } .c3 .num { color:#5eead4; }
  .code { position:absolute; right:44px; top:120px; width:268px;
          background:#00000055; border:1px solid #ffffff1f; border-radius:12px;
          font-family:Consolas,monospace; font-size:12.5px; overflow:hidden; }
  .code .bar { display:flex; gap:5px; padding:8px 10px; border-bottom:1px solid #ffffff14; }
  .dot { width:9px; height:9px; border-radius:50%; }
  .code .body { padding:11px 12px; line-height:1.65; }
  .k { color:#7dd3fc; } .v { color:#fca5a5; } .c { color:#7a7397; } .ok { color:#5eead4; }
</style></head>
<body>
  <div class="glow1"></div><div class="glow2"></div><div class="grid"></div>
  <div class="wrap">
    <div class="top">
      <div class="logo">D</div><div class="brand">Doday</div>
      <div class="dom">getdoday.ru</div>
    </div>

    <h1>Боты, <span class="accent">дыры</span><br>и 334 статьи</h1>
    <p class="sub">Как я разобрал собственный продукт по швам</p>

    <div class="code">
      <div class="bar">
        <div class="dot" style="background:#ff5f57"></div>
        <div class="dot" style="background:#febc2e"></div>
        <div class="dot" style="background:#28c840"></div>
      </div>
      <div class="body">
        <div class="c"># 40 запросов, ротация</div>
        <div><span class="k">X-Forwarded-For</span>: <span class="v">1.2.3.4</span></div>
        <div class="c"># лимит сработал:</div>
        <div><span class="ok">429</span> → <span class="v">0 раз</span></div>
      </div>
    </div>

    <div class="stats">
      <div class="card c1"><div class="num">176</div><div class="lbl">ботов за две недели</div></div>
      <div class="card c2"><div class="num">12</div><div class="lbl">дыр в своём же коде</div></div>
      <div class="card c3"><div class="num">334</div><div class="lbl">статьи в блоге</div></div>
    </div>
  </div>
</body></html>
