{# Шапка публичных страниц блога — копия лендинга с активным пунктом «Блог». #}
<header class="sticky top-0 z-30 glass">
  <nav class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-2">
    <a href="/" class="flex items-center gap-2 sm:gap-2.5 font-bold text-lg sm:text-xl min-w-0">
      <span class="grad-bg w-8 h-8 sm:w-9 sm:h-9 rounded-xl flex items-center justify-center text-white font-extrabold shadow-glow flex-shrink-0">D</span>
      <span class="grad-text">Doday</span>
    </a>
    <div class="hidden lg:flex items-center gap-6 text-sm text-[var(--text-muted)]">
      <a href="/#features" class="hover:text-[var(--text)] transition">Возможности</a>
      <a href="/for-students" class="hover:text-[var(--text)] transition">Школьникам</a>
      <a href="/qa/" class="hover:text-[var(--text)] transition">Razbery</a>
      <a href="/blog" class="text-[var(--text)] font-semibold transition">Блог</a>
      <a href="/pricing" class="hover:text-[var(--text)] transition">Тарифы</a>
      <a href="/help" class="hover:text-[var(--text)] transition">Помощь</a>
    </div>
    <div class="flex items-center gap-1.5 sm:gap-3 flex-shrink-0">
      {% if user %}
        <a href="/app/today" class="btn-primary whitespace-nowrap text-sm sm:text-base !py-2 !px-3 sm:!py-[11px] sm:!px-5">Мои задачи</a>
      {% else %}
        <a href="/auth/login" class="btn-ghost whitespace-nowrap text-sm sm:text-base !py-2 !px-3 sm:!py-[11px] sm:!px-5">Войти</a>
        <a href="/auth/register" class="btn-primary whitespace-nowrap text-sm sm:text-base !py-2 !px-3 sm:!py-[11px] sm:!px-5"><span class="hidden sm:inline">Начать </span>бесплатно</a>
      {% endif %}
    </div>
  </nav>
</header>
